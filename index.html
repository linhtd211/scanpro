<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Scanner Pro</title><link rel="manifest" href="manifest.webmanifest?v=2"><link rel="stylesheet" href="style.css?v=2"></head><body><div id="app">
<header><div><small>SCANNER PRO <i>v0.2</i></small><h1>Tài liệu</h1></div><button class="icon" id="settingsBtn">⚙︎</button></header>
<section id="home" class="screen active"><div class="search">⌕ <input id="search" placeholder="Tìm kiếm tài liệu..."></div><div class="chips" id="chips"><button class="chip on" data-cat="Tất cả">Tất cả</button><button class="chip" data-cat="Công việc">Công việc</button><button class="chip" data-cat="Cá nhân">Cá nhân</button><button class="chip" data-cat="Giấy tờ">Giấy tờ</button><button class="chip" data-cat="Báo cáo">Báo cáo</button></div><div id="docs" class="docs"></div><div id="empty" class="empty"><div class="paper">▤</div><b>Chưa có tài liệu</b><span>Quét trang giấy đầu tiên để bắt đầu.</span></div></section>
<section id="editor" class="screen"><div class="topbar"><button id="backBtn">‹</button><b>Biên tập</b><button class="primary small" id="finishBtn">Tiếp</button></div><div class="preview"><img id="mainImg"></div><div class="filters"><button data-filter="original">Gốc</button><button data-filter="auto" class="on">Tự động</button><button data-filter="document">Tài liệu</button><button data-filter="bw">Trắng đen</button><button data-filter="gray">Xám</button></div><div id="thumbs" class="thumbs"></div><div class="tools"><button id="crop">⌗<span>Cắt</span></button><button id="rotate">↻<span>Xoay</span></button><button id="enhance">☀<span>Làm rõ</span></button><button id="deletePage">⌫<span>Xóa</span></button><button id="addPage">＋<span>Thêm</span></button></div></section>
<section id="finish" class="screen"><div class="topbar"><button id="finishBack">‹</button><b>Lưu tài liệu</b><span></span></div><div class="card form"><label>Tên tài liệu<input id="docName" placeholder="Ví dụ: Biên bản họp"></label><label>Phân loại<select id="docCat"><option>Công việc</option><option>Cá nhân</option><option>Giấy tờ</option><option>Báo cáo</option></select></label><label>Chất lượng PDF<select id="pdfQuality"><option value=".72">Nhẹ</option><option value=".86" selected>Cân bằng</option><option value=".94">Cao</option></select></label></div><button class="wide primary" id="saveDoc">Lưu vào Scanner Pro</button><button class="wide" id="exportPdf">Tạo & chia sẻ PDF</button></section>
<section id="viewer" class="screen"><div class="topbar"><button id="viewerBack">‹</button><b id="viewerTitle">Tài liệu</b><button id="viewerMenu">•••</button></div><div id="viewerPages" class="viewerPages"></div><button class="wide primary" id="viewerShare">Chia sẻ PDF</button></section>
<section id="settings" class="screen"><div class="topbar"><button id="settingsBack">‹</button><b>Cài đặt</b><span></span></div><div class="card"><label>Chất lượng quét <b>Cao</b></label><label>Tự động làm rõ <input id="autoProcess" type="checkbox" checked></label><label>Lưu ảnh gốc <input id="keepOriginal" type="checkbox" checked></label></div><p class="note">Scanner Pro v0.2 · ảnh và tài liệu được xử lý cục bộ trên thiết bị.</p></section>
<nav><button data-go="home" class="on">▣<span>Tài liệu</span></button><button id="scanNav">⌗<span>Quét</span></button><button id="importNav">＋<span>Nhập ảnh</span></button><button data-go="settings">⚙︎<span>Cài đặt</span></button></nav><button id="scanFab" class="fab">⌗ &nbsp; Quét tài liệu</button>
<input id="camera" type="file" accept="image/*" capture="environment" hidden><input id="picker" type="file" accept="image/*" multiple hidden></div>
<div id="cropModal" class="modal hidden"><div class="modalTop"><button id="cropCancel">Hủy</button><b>Điều chỉnh vùng quét</b><button id="cropOk">Xong</button></div><div class="cropStage" id="cropStage"><img id="cropImg"><svg id="cropSvg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><polygon id="cropPoly"/><circle data-p="0"/><circle data-p="1"/><circle data-p="2"/><circle data-p="3"/></svg></div><p>Kéo 4 điểm vào đúng các góc của trang giấy.</p></div><div id="toast"></div><script src="app.js?v=2"></script></body></html>
