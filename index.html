<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6bcb"><title>ScanPro</title><style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--ac:#0b6bcb;--bd:#e4e7ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mu:#98a2b3;--ac:#4c9bf0;--bd:#2a323d}}
:root[data-theme=dark]{--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mu:#98a2b3;--ac:#4c9bf0;--bd:#2a323d}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,input{font:inherit;color:inherit}input{font-size:16px}
button{background:var(--card);border:1px solid var(--bd);border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.i{width:44px;padding:0;display:inline-grid;place-items:center;border:0;background:none}
#app{max-width:760px;margin:0 auto;padding:16px 16px 96px}h1{font-size:26px;margin:4px 0 12px}h2{font-size:16px;margin:20px 0 10px}
.s{width:100%;height:46px;border:1px solid var(--bd);border-radius:12px;padding:0 14px;background:var(--card)}
.q{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.q button{display:flex;gap:10px;align-items:center;height:56px;font-weight:600}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row img,.row .ph{width:52px;height:68px;object-fit:cover;border-radius:6px;background:var(--bd)}.row .t{flex:1;min-width:0}.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.m{color:var(--mu);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.g .row{flex-direction:column;align-items:stretch}.g .row img{width:100%;height:150px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mu);min-width:56px;gap:2px}.nav button.on{color:var(--ac)}
.nav .sc{background:var(--ac);color:#fff;border-radius:50%;width:60px;height:60px;min-height:0;margin-top:-26px;box-shadow:0 4px 12px rgba(11,107,203,.4);justify-content:center}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(90px + env(safe-area-inset-bottom,0px))}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:21;overflow-x:auto}.bar button{flex:none}
.cam{background:#000;color:#fff;padding:0}.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.cam svg.pl{position:absolute;inset:0;width:100%;height:100%}
.cam .top,.cam .bot{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px;z-index:2}.cam .top{top:env(safe-area-inset-top,0px)}.cam .bot{bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(transparent,rgba(0,0,0,.6))}
.cam button{background:rgba(255,255,255,.18);border-color:transparent;color:#fff}.shut{width:70px;height:70px;border-radius:50%!important;background:#fff!important;border:5px solid rgba(255,255,255,.5)!important}
.hint{position:absolute;top:70px;left:0;right:0;text-align:center;z-index:2}.hint span{background:rgba(0,0,0,.6);padding:6px 14px;border-radius:20px}
.th{display:flex;gap:6px;overflow-x:auto;max-width:40%}.th img{height:44px;border-radius:4px}
.pg{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px;text-align:center}.pg img{width:100%;border-radius:6px}.pg .n{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);color:#fff;border-radius:10px;padding:0 8px;font-size:12px}
.w{border:1px solid #d92d20;color:#d92d20;border-radius:6px;font-size:12px;padding:1px 6px;display:inline-block;margin-top:4px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;justify-content:center}#toast div{background:#1d2939;color:#fff;border-radius:12px;padding:10px 16px;display:flex;gap:14px;align-items:center}#toast button{background:none;border:0;color:#7fc0ff;min-height:32px;padding:0;font-weight:700}
#sh{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none;align-items:flex-end}#sh>div{background:var(--card);width:100%;max-width:760px;margin:auto auto 0;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.ch button.on{background:var(--ac);color:#fff;border-color:var(--ac)}label.r{display:block;margin:8px 0;font-size:13px;color:var(--mu)}label.r input{width:100%}
.cr{position:relative;margin:8px auto;max-width:100%;touch-action:none}.cr img{width:100%;display:block;user-select:none}.cr svg{position:absolute;inset:0;width:100%;height:100%}
.empty{text-align:center;padding:60px 20px;color:var(--mu)}.empty h2{color:var(--tx)}
</style></head><body><div id="app"></div><div id="ov" class="ov" hidden></div><div id="ov2" class="ov" hidden></div><div id="sh"></div><div id="toast"></div>
<script>
/* ============ TIỆN ÍCH & ICON ============ */
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const IC={scan:'<path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3M4 12h16"/>',doc:'<path d="M7 3h7l5 5v13H7zM14 3v5h5"/>',tool:'<path d="M14 6l4 4-9 9H5v-4z"/>',ocr:'<path d="M5 8V5h3M16 5h3v3M19 16v3h-3M8 19H5v-3M8 12h8"/>',set:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',more:'<circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>',img:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 16l5-5 4 4 3-3 4 4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',grid:'<rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/>',list:'<path d="M5 7h14M5 12h14M5 17h14"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
function toast(m,undo){const t=$('#toast');t.innerHTML=`<div>${esc(m)}${undo?'<button id="un">HOÀN TÁC</button>':''}</div>`;if(undo)$('#un').onclick=()=>{undo();t.innerHTML=''};clearTimeout(toast.h);toast.h=setTimeout(()=>t.innerHTML='',5000)}
function sheet(h){const s=$('#sh');if(!h){s.style.display='none';return}s.innerHTML='<div>'+h+'</div>';s.style.display='flex';s.onclick=e=>{if(e.target===s)sheet()}}
const toBlob=(c,q=.88)=>new Promise(r=>c.toBlob(r,'image/jpeg',q));
const fmtSize=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB';
const fmtDate=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});

/* ============ LƯU TRỮ (IndexedDB, có dự phòng bộ nhớ tạm) ============ */
const DB=(()=>{let db,mem=[];const open=()=>new Promise(r=>{try{const q=indexedDB.open('scanpro',1);q.onupgradeneeded=()=>q.result.createObjectStore('docs',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const tx=(m,f)=>new Promise((res,rej)=>{const t=db.transaction('docs',m),o=f(t.objectStore('docs'));t.oncomplete=()=>res(o.result);t.onerror=()=>rej(t.error)});
return{open,all:()=>db?tx('readonly',s=>s.getAll()):mem.slice(),put:d=>{if(!db){mem=mem.filter(x=>x.id!=d.id);mem.push(d);return}return tx('readwrite',s=>s.put(d))},del:id=>{if(!db){mem=mem.filter(x=>x.id!=id);return}return tx('readwrite',s=>s.delete(id))},persistent:()=>!!db}})();

/* ============ SCANNER ENGINE: detect / warp / enhance / blur ============ */
const Eng={
 // Đọc ảnh, thu nhỏ tối đa 2000px để tiết kiệm RAM
 async load(b){const i=await createImageBitmap(b),s=Math.min(1,2000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s|0;c.height=i.height*s|0;c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c},
 // Tìm vùng giấy sáng lớn nhất (xấp xỉ hình chữ nhật). Trả về góc chuẩn hoá TL,TR,BR,BL
 detect(c){const w=96,h=Math.max(8,Math.round(96*c.height/c.width)),t=document.createElement('canvas');t.width=w;t.height=h;const x=t.getContext('2d');x.drawImage(c,0,0,w,h);const d=x.getImageData(0,0,w,h).data,g=[];let s=0;for(let i=0;i<d.length;i+=4){const v=.3*d[i]+.59*d[i+1]+.11*d[i+2];g.push(v);s+=v}
  const th=Math.max(s/g.length*1.05,90),rows=Array(h).fill(0),cols=Array(w).fill(0);g.forEach((v,i)=>{if(v>th){rows[i/w|0]++;cols[i%w]++}});
  const r=rows.map((n,i)=>n>w*.25?i:-1).filter(i=>i>=0),k=cols.map((n,i)=>n>h*.25?i:-1).filter(i=>i>=0);
  if(!r.length||!k.length)return{ok:0,q:Eng.full(.06)};const x0=k[0]/w,x1=(k.at(-1)+1)/w,y0=r[0]/h,y1=(r.at(-1)+1)/h;
  if((x1-x0)*(y1-y0)<.25)return{ok:0,q:Eng.full(.06)};return{ok:1,q:[[x0,y0],[x1,y0],[x1,y1],[x0,y1]]}},
 full:(m=0)=>[[m,m],[1-m,m],[1-m,1-m],[m,1-m]],
 // Chỉnh phối cảnh: ánh xạ hình vuông đơn vị -> tứ giác (homography), lấy mẫu song tuyến
 warp(c,q){const P=q.map(p=>[p[0]*c.width,p[1]*c.height]),dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);let W=(dist(P[0],P[1])+dist(P[3],P[2]))/2,H=(dist(P[0],P[3])+dist(P[1],P[2]))/2;const k=Math.min(1,1700/Math.max(W,H));W=Math.max(8,W*k|0);H=Math.max(8,H*k|0);
  const[[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=P,dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3,den=dx1*dy2-dy1*dx2||1e-9,g=(dx3*dy2-dy3*dx2)/den,h=(dx1*dy3-dy1*dx3)/den,a=x1-x0+g*x1,b=x3-x0+h*x3,d=y1-y0+g*y1,e=y3-y0+h*y3;
  const sx=c.getContext('2d').getImageData(0,0,c.width,c.height),S=sx.data,o=document.createElement('canvas');o.width=W;o.height=H;const ox=o.getContext('2d'),od=ox.createImageData(W,H),D=od.data;
  for(let j=0;j<H;j++){const v=j/(H-1);for(let i=0;i<W;i++){const u=i/(W-1),z=g*u+h*v+1,X=Math.min(c.width-1.01,Math.max(0,(a*u+b*v+x0)/z)),Y=Math.min(c.height-1.01,Math.max(0,(d*u+e*v+y0)/z)),xi=X|0,yi=Y|0,fx=X-xi,fy=Y-yi,p=(yi*c.width+xi)*4,o4=(j*W+i)*4;
   for(let n=0;n<3;n++)D[o4+n]=(S[p+n]*(1-fx)+S[p+4+n]*fx)*(1-fy)+(S[p+c.width*4+n]*(1-fx)+S[p+c.width*4+4+n]*fx)*fy;D[o4+3]=255}}
  ox.putImageData(od,0,0);return o},
 // Ước lượng nền giấy (ảnh thu nhỏ rồi phóng to) để san đều ánh sáng
 bg(c){const s=document.createElement('canvas');s.width=Math.max(2,c.width/14|0);s.height=Math.max(2,c.height/14|0);s.getContext('2d').drawImage(c,0,0,s.width,s.height);const u=document.createElement('canvas');u.width=c.width;u.height=c.height;const x=u.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(s,0,0,c.width,c.height);return x.getImageData(0,0,c.width,c.height).data},
 // Bộ lọc + chỉnh tay (b: sáng, c: tương phản, t: nhiệt độ màu). Không đụng vào ảnh gốc.
 enhance(c,mode,adj){const x=c.getContext('2d'),im=x.getImageData(0,0,c.width,c.height),d=im.data,B=mode=='orig'||mode=='photo'?null:Eng.bg(c),cf=1+adj.c/100;
  for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];
   if(B){const k=n=>Math.min(255,d[i+n]*250/Math.max(B[i+n],40));r=k(0);g=k(1);b=k(2);const l=.3*r+.59*g+.11*b;
    if(mode=='text'){const v=Math.max(0,Math.min(255,(l-95)*1.7));r=g=b=v}
    else if(mode=='bw'){r=g=b=l>172?255:0}
    else if(mode=='red'){const red=r-Math.max(g,b)>45,blue=b-r>40;if(!red&&!blue){const v=l>195?255:Math.max(0,(l-85)*1.5);r=g=b=v}}}
   else if(mode=='photo'){r=(r-128)*1.05+128;g=(g-128)*1.05+128;b=(b-128)*1.05+128}
   d[i]=(r-128)*cf+128+adj.b*1.5+adj.t*.4;d[i+1]=(g-128)*cf+128+adj.b*1.5;d[i+2]=(b-128)*cf+128+adj.b*1.5-adj.t*.4}
  x.putImageData(im,0,0)},
 rotate(c,n){if(!n)return c;const o=document.createElement('canvas'),s=n%2;o.width=s?c.height:c.width;o.height=s?c.width:c.height;const x=o.getContext('2d');x.translate(o.width/2,o.height/2);x.rotate(n*Math.PI/2);x.drawImage(c,-c.width/2,-c.height/2);return o},
 // Kiểm tra chất lượng: độ mờ (phương sai Laplacian) và độ sáng
 quality(c){const s=document.createElement('canvas');s.width=240;s.height=Math.max(8,240*c.height/c.width|0);const x=s.getContext('2d');x.drawImage(c,0,0,s.width,s.height);const d=x.getImageData(0,0,s.width,s.height).data,w=s.width,L=[];let m=0;for(let i=0;i<d.length;i+=4){const v=.3*d[i]+.59*d[i+1]+.11*d[i+2];L.push(v);m+=v}m/=L.length;
  let sum=0,sq=0,n=0;for(let y=1;y<s.height-1;y++)for(let i=1;i<w-1;i++){const p=y*w+i,l=4*L[p]-L[p-1]-L[p+1]-L[p-w]-L[p+w];sum+=l;sq+=l*l;n++}
  const w1=[];if(sq/n-(sum/n)**2<40)w1.push('Có thể bị mờ');if(m<60)w1.push('Quá tối');if(m>238)w1.push('Quá sáng');return w1}};

/* ============ PDF WRITER (tự viết, nhúng JPEG, không phụ thuộc thư viện) ============ */
async function makePDF(pages){const E=new TextEncoder(),parts=[],off=[];let len=0;const add=x=>{const u=typeof x=='string'?E.encode(x):x;parts.push(u);len+=u.length},n=pages.length;add('%PDF-1.4\n');
 const obj=(i,body,stream)=>{off[i]=len;add(`${i} 0 obj\n${body}\n`);if(stream){add('stream\n');add(stream);add('\nendstream\n')}add('endobj\n')};
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,`<</Type/Pages/Count ${n}/Kids[${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}]>>`);
 for(let i=0;i<n;i++){const p=pages[i],W=595,H=Math.round(595*p.h/p.w),cs=`q ${W} 0 0 ${H} 0 0 cm /Im Do Q`,jb=new Uint8Array(await p.out.arrayBuffer());
  obj(3+3*i,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im ${5+3*i} 0 R>>>>/Contents ${4+3*i} 0 R>>`);obj(4+3*i,`<</Length ${cs.length}>>`,cs);obj(5+3*i,`<</Type/XObject/Subtype/Image/Width ${p.w}/Height ${p.h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jb.length}>>`,jb)}
 const xr=len,N=3+3*n;add(`xref\n0 ${N}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<</Size ${N}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
async function deliver(blob,name){const f=new File([blob],name,{type:'application/pdf'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});toast('Đã xuất PDF');return}}catch(e){if(e.name=='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Đã xuất PDF')}

/* ============ TRANG & TÀI LIỆU ============ */
let S={tab:'home',docs:[],q:'',view:'list',cur:null,sel:null};
// Xử lý lại một trang từ ảnh gốc theo góc/bộ lọc/chỉnh tay hiện tại
async function renderPage(p){const c=await Eng.load(p.orig);let w=Eng.warp(c,p.corners);Eng.enhance(w,p.filter,p.adj);w=Eng.rotate(w,p.rot);p.warn=Eng.quality(w);p.out=await toBlob(w);p.w=w.width;p.h=w.height;const t=document.createElement('canvas');t.width=200;t.height=Math.round(200*w.height/w.width);t.getContext('2d').drawImage(w,0,0,t.width,t.height);p.thumb=t.toDataURL('image/jpeg',.7)}
async function addBlob(b,auto=true){const c=await Eng.load(b),p={id:uid(),orig:b,corners:Eng.detect(c).q,filter:'auto',adj:{b:0,c:0,t:0},rot:0};await renderPage(p);S.cur.pages.push(p);return p}
function newDoc(){const n=new Date();S.cur={id:uid(),name:'Tài liệu '+n.toLocaleDateString('vi-VN')+' '+n.toTimeString().slice(0,5),pages:[],created:Date.now()}}
async function saveDoc(){const d=S.cur;d.updated=Date.now();d.size=d.pages.reduce((s,p)=>s+p.out.size,0);d.thumb=d.pages[0]?.thumb;await DB.put(d);await load();toast('Đã lưu tài liệu')}
async function load(){S.docs=(await DB.all()).sort((a,b)=>b.updated-a.updated);if(S.tab=='home'&&!S.cur)render()}
function pickImages(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=async()=>{if(!i.files.length)return;toast('Đang xử lý ảnh...');for(const f of i.files)await addBlob(f);cb()};i.click()}

/* ============ MÀN HÌNH CHÍNH ============ */
function render(){const a=$('#app');let h='';
 if(S.tab=='home'){const q=S.q.toLowerCase(),L=S.docs.filter(d=>!q||d.name.toLowerCase().includes(q)||fmtDate(d.updated).includes(q));
  h=`<h1>ScanPro</h1><input class="s" id="q" placeholder="Tìm kiếm tài liệu..." value="${esc(S.q)}" aria-label="Tìm kiếm">
  <div class="q"><button onclick="startScan()">${ic('scan')} Quét tài liệu</button><button onclick="importImgs()">${ic('img')} Nhập ảnh</button><button onclick="soon()">${ic('doc')} Nhập PDF</button><button onclick="soon()">${ic('ocr')} OCR</button></div>
  <h2 style="display:flex;justify-content:space-between;align-items:center">Tài liệu gần đây<button class="i" aria-label="Đổi kiểu hiển thị" onclick="S.view=S.view=='list'?'grid':'list';render()">${ic(S.view=='list'?'grid':'list')}</button></h2>`;
  if(!S.docs.length)h+=`<div class="empty"><h2>Chưa có tài liệu</h2><p>Quét tài liệu đầu tiên của bạn</p><button class="p" onclick="startScan()">Quét ngay</button></div>`;
  else h+=`<div class="${S.view=='grid'?'g':''}">`+L.map(d=>`<div class="row" ><img src="${d.thumb||''}" alt="" onclick="openDoc('${d.id}')"><div class="t" onclick="openDoc('${d.id}')"><b>${esc(d.name)}</b><span class="m">${d.pages.length} trang · ${fmtSize(d.size)}<br>${fmtDate(d.updated)}</span></div><button class="i" aria-label="Thêm thao tác" onclick="menu('${d.id}')">${ic('more')}</button></div>`).join('')+'</div>';
  if(!DB.persistent())h+='<p class="m">Lưu ý: trình duyệt hiện tại không cho lưu lâu dài; tài liệu sẽ mất khi đóng trang.</p>'}
 else if(S.tab=='set')h=`<h1>Cài đặt</h1><div class="row"><div class="t"><b>Giao diện</b></div><button onclick="theme()">Sáng / Tối</button></div><h2>Quyền riêng tư</h2><p>Tài liệu được xử lý trên thiết bị khi có thể. Hiện ScanPro không gửi bất kỳ dữ liệu nào lên máy chủ.</p>`;
 else h=`<h1>${S.tab=='tool'?'Công cụ PDF':'OCR tiếng Việt'}</h1><div class="empty"><h2>Tính năng đang được hoàn thiện</h2><p>Phase 1 tập trung vào quét, xử lý ảnh, quản lý trang và xuất PDF.</p></div>`;
 a.innerHTML=h+`<nav class="nav" aria-label="Điều hướng">${[['home','Tài liệu','doc'],['tool','Công cụ','tool'],['sc','Scan','scan'],['ocr','OCR','ocr'],['set','Cài đặt','set']].map(([k,l,i])=>k=='sc'?`<button class="sc" aria-label="Scan" onclick="startScan()">${ic('scan',28)}</button>`:`<button class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${ic(i)}${l}</button>`).join('')}</nav>`;
 const q=$('#q');if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
const soon=()=>toast('Tính năng đang được hoàn thiện');
function theme(){const r=document.documentElement,d=r.dataset.theme=='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
function menu(id){const d=S.docs.find(x=>x.id==id);sheet(`<b>${esc(d.name)}</b><div class="ch" style="flex-direction:column"><button onclick="sheet();openDoc('${id}')">Mở</button><button onclick="renameDoc('${id}')">Đổi tên</button><button onclick="sheet();exportDoc('${id}')">Xuất PDF</button><button onclick="dupDoc('${id}')">Nhân bản</button><button onclick="delDoc('${id}')">Xóa</button></div>`)}
function renameDoc(id){const d=S.docs.find(x=>x.id==id);sheet(`<input class="s" id="rn" value="${esc(d.name)}" aria-label="Tên tài liệu"><div class="ch"><button class="p" id="rok">Lưu</button></div>`);$('#rok').onclick=async()=>{d.name=$('#rn').value.trim()||d.name;await DB.put(d);sheet();load();toast('Đã đổi tên')}}
async function dupDoc(id){const d={...S.docs.find(x=>x.id==id),id:uid(),updated:Date.now()};d.name+=' (bản sao)';await DB.put(d);sheet();load();toast('Đã nhân bản')}
async function delDoc(id){const d=S.docs.find(x=>x.id==id);await DB.del(id);sheet();load();toast('Đã xóa tài liệu',async()=>{await DB.put(d);load()})}
async function exportDoc(id,d){d=d||S.docs.find(x=>x.id==id);toast('Đang tạo PDF...');deliver(await makePDF(d.pages),d.name.replace(/[\\/:*?"<>|]/g,'-')+'.pdf')}
function openDoc(id){S.cur=S.docs.find(x=>x.id==id);review()}
function importImgs(){newDoc();pickImages(review)}

/* ============ CAMERA & TỰ ĐỘNG CHỤP ============ */
const Cam={stream:null,tm:null,prev:null,still:0,last:0,auto:true,busy:false};
function startScan(){if(!S.cur||!$('#ov').hidden===false&&!S.cur.pages.length)newDoc();if(!S.cur||S.cur.saved)newDoc();openCam()}
async function openCam(){const o=$('#ov2');o.hidden=false;o.className='ov cam';o.innerHTML=`<video id="v" autoplay playsinline muted></video><svg class="pl" id="pl"><polygon id="pg" fill="rgba(76,155,240,.18)" stroke="#4c9bf0" stroke-width="3"/></svg>
 <div class="top"><button class="i" aria-label="Đóng" onclick="closeCam()">${ic('x')}</button><button id="am">Tự động</button></div><div class="hint"><span id="ht">Đưa tài liệu vào trong khung</span></div>
 <div class="bot"><div class="th" id="ths"></div><button class="shut" id="sh1" aria-label="Chụp"></button><button class="p" onclick="closeCam(true)" id="dn">Xong</button></div>`;
 $('#am').onclick=()=>{Cam.auto=!Cam.auto;$('#am').textContent=Cam.auto?'Tự động':'Thủ công';Cam.still=0};$('#sh1').onclick=()=>snap();updCam();
 try{Cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920}}});const v=$('#v');v.srcObject=Cam.stream;v.onloadedmetadata=()=>$('#pl').setAttribute('viewBox',`0 0 ${v.videoWidth} ${v.videoHeight}`);Cam.tm=setInterval(tick,300)}
 catch(e){o.className='ov';o.innerHTML=`<div class="empty"><h2>Không thể truy cập camera</h2><p>Hãy cấp quyền camera cho ScanPro để quét tài liệu.</p><div class="ch" style="justify-content:center"><button class="p" onclick="openCam()">Thử lại</button><button onclick="closeCam();pickImages(review)">Chọn ảnh từ thư viện</button><button onclick="closeCam()">Đóng</button></div></div>`}}
function updCam(){const n=S.cur.pages.length;$('#dn')&&($('#dn').textContent=n?`Xong (${n})`:'Xong');$('#ths')&&($('#ths').innerHTML=S.cur.pages.slice(-4).map(p=>`<img src="${p.thumb}" alt="">`).join(''));if(n)$('#ht').textContent=`Đã quét ${n} trang`}
function tick(){const v=$('#v');if(!v||!v.videoWidth||Cam.busy)return;const c=document.createElement('canvas');c.width=160;c.height=Math.round(160*v.videoHeight/v.videoWidth);const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;let df=0;if(Cam.prev&&Cam.prev.length==d.length){for(let i=0;i<d.length;i+=16)df+=Math.abs(d[i]-Cam.prev[i]);df/=d.length/16}else df=99;Cam.prev=d;
 const r=Eng.detect(c),V=[v.videoWidth,v.videoHeight];$('#pg').setAttribute('points',r.ok?r.q.map(p=>p[0]*V[0]+','+p[1]*V[1]).join(' '):'');
 if(r.ok&&df<5)Cam.still++;else Cam.still=0;if(!Cam.auto||Date.now()-Cam.last<2500)return;
 const h=$('#ht');if(Cam.still>=5){snap()}else if(Cam.still>=2)h.textContent='Giữ yên...';else h.textContent=r.ok?'Đã phát hiện tài liệu':'Đưa tài liệu vào trong khung'}
async function snap(){const v=$('#v');if(!v||Cam.busy||!v.videoWidth)return;Cam.busy=true;Cam.last=Date.now();Cam.still=0;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);try{await addBlob(await toBlob(c,.92))}catch(e){toast('Không thể xử lý ảnh vừa chụp')}Cam.busy=false;Cam.last=Date.now();updCam()}
function closeCam(done){clearInterval(Cam.tm);Cam.stream?.getTracks().forEach(t=>t.stop());Cam.stream=null;const o=$('#ov2');o.hidden=true;o.innerHTML='';if(done&&S.cur.pages.length)review();else if(S.cur&&!S.cur.pages.length)S.cur=null}

/* ============ XEM LẠI TÀI LIỆU / QUẢN LÝ TRANG ============ */
function review(){const d=S.cur,o=$('#ov');o.hidden=false;o.className='ov';const tot=d.pages.reduce((s,p)=>s+p.out.size,0);
 o.innerHTML=`<div style="display:flex;gap:8px;align-items:center"><button class="i" aria-label="Đóng" onclick="closeReview()">${ic('x')}</button><input class="s" id="dnm" value="${esc(d.name)}" aria-label="Tên tài liệu"></div><p class="m">${d.pages.length} trang · khoảng ${fmtSize(tot)} · chạm vào trang để chỉnh sửa</p>
 <div class="g">${d.pages.map((p,i)=>`<div class="pg" onclick="pageMenu(${i})"><span class="n">${i+1}</span><img src="${p.thumb}" alt="Trang ${i+1}">${p.warn.length?`<span class="w">Trang ${i+1}: ${p.warn.join(', ')}</span>`:''}</div>`).join('')}</div>
 <div class="bar"><button onclick="addMore()">Thêm trang</button><button onclick="pickImages(review)">Nhập ảnh</button><button onclick="viewer()">Xem</button><button onclick="doExport()">Xuất PDF</button><button class="p" onclick="doSave()">Lưu</button></div>`;
 $('#dnm').onchange=e=>d.name=e.target.value.trim()||d.name}
function closeReview(){$('#ov').hidden=true;S.cur=null;render()}
const addMore=()=>openCam();
async function doSave(){if(!S.cur.pages.length)return toast('Chưa có trang nào');await saveDoc();closeReview()}
async function doExport(){if(!S.cur.pages.length)return;toast('Đang tạo PDF...');deliver(await makePDF(S.cur.pages),S.cur.name.replace(/[\\/:*?"<>|]/g,'-')+'.pdf')}
const FL=[['auto','Tự động'],['orig','Gốc'],['text','Văn bản'],['bw','Đen trắng'],['color','Màu'],['red','Dấu đỏ'],['photo','Ảnh']];
function pageMenu(i){const p=S.cur.pages[i];sheet(`<b>Trang ${i+1}</b><div class="ch">${FL.map(([k,l])=>`<button class="${p.filter==k?'on':''}" onclick="setF(${i},'${k}')">${l}</button>`).join('')}</div>
 <label class="r">Độ sáng<input type="range" min="-60" max="60" value="${p.adj.b}" oninput="p_(${i},'b',this.value)"></label><label class="r">Tương phản<input type="range" min="-50" max="80" value="${p.adj.c}" oninput="p_(${i},'c',this.value)"></label><label class="r">Nhiệt độ màu<input type="range" min="-60" max="60" value="${p.adj.t}" oninput="p_(${i},'t',this.value)"></label>
 <div class="ch"><button onclick="cropPage(${i})">Cắt lại</button><button onclick="rot(${i},3)">Xoay trái</button><button onclick="rot(${i},1)">Xoay phải</button><button onclick="mv(${i},-1)">Lùi lại</button><button onclick="mv(${i},1)">Tiến lên</button><button onclick="dupP(${i})">Nhân bản</button><button onclick="resetP(${i})">Khôi phục</button><button onclick="delP(${i})">Xóa</button></div>`)}
async function upd(i){await renderPage(S.cur.pages[i]);review()}
let tmr;function p_(i,k,v){S.cur.pages[i].adj[k]=+v;clearTimeout(tmr);tmr=setTimeout(async()=>{await renderPage(S.cur.pages[i]);review();pageMenu(i)},350)}
async function setF(i,k){S.cur.pages[i].filter=k;await upd(i);pageMenu(i)}
async function rot(i,n){const p=S.cur.pages[i];p.rot=(p.rot+n)%4;await upd(i);toast('Đã xoay trang');sheet()}
function mv(i,s){const a=S.cur.pages,j=i+s;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];sheet();review();toast('Đã đổi thứ tự')}
function dupP(i){const a=S.cur.pages;a.splice(i+1,0,{...a[i],id:uid(),adj:{...a[i].adj}});sheet();review();toast('Đã nhân bản trang')}
async function resetP(i){const p=S.cur.pages[i];Object.assign(p,{filter:'auto',adj:{b:0,c:0,t:0},rot:0});p.corners=Eng.detect(await Eng.load(p.orig)).q;await upd(i);sheet();toast('Đã khôi phục ảnh gốc')}
function delP(i){const a=S.cur.pages,p=a.splice(i,1)[0];sheet();review();toast(`Đã xóa trang ${i+1}`,()=>{a.splice(i,0,p);review()})}

/* ============ ĐIỀU CHỈNH VÙNG QUÉT (kéo 4 góc) ============ */
async function cropPage(i){sheet();const p=S.cur.pages[i],o=$('#ov2');o.hidden=false;o.className='ov';const url=URL.createObjectURL(p.orig),q=p.corners.map(x=>[...x]);
 o.innerHTML=`<h2>Điều chỉnh vùng quét</h2><div class="cr" id="cr"><img id="ci" src="${url}" alt="Ảnh gốc"><svg viewBox="0 0 1 1" preserveAspectRatio="none"><polygon id="cp" fill="rgba(76,155,240,.2)" stroke="#4c9bf0" stroke-width=".004"/>${[0,1,2,3].map(n=>`<circle data-n="${n}" r=".035" fill="#4c9bf0" stroke="#fff" stroke-width=".006" style="cursor:grab"/>`).join('')}</svg></div>
 <div class="bar"><button id="ca">Tự động</button><button id="cf">Toàn ảnh</button><button id="cx">Hủy</button><button class="p" id="co">Xác nhận</button></div>`;
 const draw=()=>{$('#cp').setAttribute('points',q.map(a=>a.join(',')).join(' '));o.querySelectorAll('circle').forEach(c=>{c.setAttribute('cx',q[c.dataset.n][0]);c.setAttribute('cy',q[c.dataset.n][1])})};draw();
 let act=null;const cr=$('#cr');cr.onpointerdown=e=>{if(e.target.dataset.n!=null){act=+e.target.dataset.n;cr.setPointerCapture(e.pointerId)}};cr.onpointermove=e=>{if(act==null)return;const r=cr.getBoundingClientRect();q[act]=[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];draw()};cr.onpointerup=()=>act=null;
 const close=()=>{URL.revokeObjectURL(url);o.hidden=true;o.innerHTML=''};
 $('#ca').onclick=async()=>{q.splice(0,4,...Eng.detect(await Eng.load(p.orig)).q);draw()};$('#cf').onclick=()=>{q.splice(0,4,...Eng.full());draw()};$('#cx').onclick=close;
 $('#co').onclick=async()=>{p.corners=q;close();toast('Đang xử lý...');await upd(i)}}

/* ============ TRÌNH XEM TÀI LIỆU ============ */
function viewer(){const o=$('#ov2'),urls=S.cur.pages.map(p=>URL.createObjectURL(p.out));o.hidden=false;o.className='ov';let z=1;
 o.innerHTML=`<div style="position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;z-index:2"><button class="i" aria-label="Đóng" id="vx">${ic('x')}</button><b id="vn" style="background:var(--card);padding:4px 12px;border-radius:12px">1 / ${urls.length}</b><span><button id="vm">−</button> <button id="vp">+</button></span></div><div id="vw" style="overflow-x:auto">${urls.map((u,i)=>`<img data-i="${i}" src="${u}" alt="Trang ${i+1}" style="display:block;width:100%;margin:10px auto;border:1px solid var(--bd);background:#fff">`).join('')}</div>`;
 const imgs=[...o.querySelectorAll('img')],ob=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)$('#vn').textContent=`${+e.target.dataset.i+1} / ${urls.length}`}),{threshold:.5});imgs.forEach(i=>ob.observe(i));
 const zz=d=>{z=Math.min(4,Math.max(1,z+d));imgs.forEach(i=>i.style.width=z*100+'%')};$('#vp').onclick=()=>zz(.5);$('#vm').onclick=()=>zz(-.5);
 $('#vx').onclick=()=>{ob.disconnect();urls.forEach(URL.revokeObjectURL);o.hidden=true;o.innerHTML=''}}

DB.open().then(load).then(render);
</script></body></html>
