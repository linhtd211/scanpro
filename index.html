<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><title>Scanner Pro</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<div id="app">
<header><div><small>SCANNER PRO</small><h1>Tài liệu</h1></div><button class="icon" id="settingsBtn">⚙︎</button></header>
<section id="home" class="screen active"><div class="search">⌕ <input id="search" placeholder="Tìm kiếm tài liệu..."></div><div class="chips"><button class="chip on">Tất cả</button><button class="chip">Công việc</button><button class="chip">Cá nhân</button><button class="chip">Giấy tờ</button></div><div id="docs" class="docs"></div><div id="empty" class="empty"><div class="paper">▤</div><b>Chưa có tài liệu</b><span>Quét trang giấy đầu tiên để bắt đầu.</span></div></section>
<section id="editor" class="screen"><div class="topbar"><button id="backBtn">‹</button><b>Biên tập tài liệu</b><button class="primary small" id="savePdf">Tạo PDF</button></div><div id="preview" class="preview"><img id="mainImg"></div><div class="filters"><button data-filter="original" class="on">Gốc</button><button data-filter="auto">Tự động</button><button data-filter="document">Tài liệu</button><button data-filter="bw">Trắng đen</button><button data-filter="gray">Xám</button></div><div id="thumbs" class="thumbs"></div><div class="tools"><button id="rotate">↻<span>Xoay</span></button><button id="enhance">☀<span>Làm rõ</span></button><button id="deletePage">⌫<span>Xóa trang</span></button><button id="addPage">＋<span>Thêm trang</span></button></div></section>
<section id="settings" class="screen"><div class="topbar"><button id="settingsBack">‹</button><b>Cài đặt</b><span></span></div><div class="card"><label>Chất lượng quét <b>Cao</b></label><label>Tự động xử lý <input id="autoProcess" type="checkbox" checked></label><label>Lưu ảnh gốc <input id="keepOriginal" type="checkbox"></label></div><p class="note">v0.1 · Dữ liệu được lưu cục bộ trên thiết bị. Không tải ảnh lên máy chủ.</p></section>
<nav><button data-go="home" class="on">▣<span>Tài liệu</span></button><button id="scanNav">⌗<span>Quét</span></button><button id="importNav">＋<span>Nhập ảnh</span></button><button data-go="settings">⚙︎<span>Cài đặt</span></button></nav>
<button id="scanFab" class="fab">⌗ &nbsp; Quét tài liệu</button>
<input id="camera" type="file" accept="image/*" capture="environment" multiple hidden><input id="picker" type="file" accept="image/*" multiple hidden>
</div><div id="toast"></div><script src="app.js"></script></body></html>
